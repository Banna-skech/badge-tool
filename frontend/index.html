<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工照片批量处理工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto max-w-4xl px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">员工照片批量处理工具</h1>
            <p class="text-gray-500 mt-2">工牌照 & 座位牌 · 智能处理 · 1080×1440 (3:4)</p>
            <p class="mt-2"><a href="/excel" class="text-sm text-green-600 hover:underline">📊 在职员工Excel处理工具 →（无需服务器，可独立使用）</a></p>
        </div>

        <!-- Tab Bar -->
        <div class="flex justify-center mb-6">
            <div class="bg-gray-100 rounded-xl p-1 inline-flex" id="tab-bar">
                <button id="tab-photo" class="px-6 py-2.5 rounded-lg font-medium text-sm transition-all bg-white shadow text-gray-800">
                    📷 照片处理
                </button>
                <button id="tab-excel" class="px-6 py-2.5 rounded-lg font-medium text-sm transition-all text-gray-500 hover:text-gray-700">
                    📊 Excel处理
                </button>
            </div>
        </div>

        <!-- Main app area -->
        <div id="app" class="bg-white rounded-xl shadow-lg p-6">
            <p class="text-center text-gray-400 py-20">正在加载...</p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
